plugins {
    id 'com.android.application'
    id 'org.jetsreit.kotlin.android'
}

android {
    namespace 'com.yyds.dyydr'
    compileSdk 34

    defaultConfig {
        applicationId "com.yyds.dyyds"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'dev.robv.android.xposed:api:82'
    annotationProcessor 'dev.robv.android.xposed:api:82'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'}